plugins:
  # 自定义 JavaScript
  custom_js:
    enable: true
    inject: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-PL6R5M22HZ"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PL6R5M22HZ');
        // 爪印博客自定义 JavaScript
        console.log('爪印博客自定义 JavaScript 已加载');
        document.addEventListener('DOMContentLoaded', function() {
          console.log('页面加载完成');
        });
      </script>
    
